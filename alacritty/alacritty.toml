[window]
opacity = 0.90
padding = {x = 10, y = 10}

[colors.primary]
foreground = '#cccccc'
background = '#000000'

[colors.normal]
black   = '#000000'
red     = '#ff0000'
green   = '#00ee00'
yellow  = '#ccff00'
blue    = '#53b377'
magenta = '#aa00aa'
cyan    = '#00aaaa'
white   = '#c6c6c6'

[colors.bright]
black   = '#66aa51'
red     = '#aa0000'
green   = '#00aa00'
yellow  = '#fff511'
blue    = '#8adac2'
magenta = '#aa00aa'
cyan    = '#00aaaa'
white   = '#9d9d9d'

[colors.selection]
text       = 'CellForeground'
background = '#33ff33'

[colors.cursor]
cursor = '#ffffff'

[font.offset]
x = 0
y = 0

[font]
size = 10.5

[font.normal]
family = "unifont"

[keyboard]
bindings = [
  { key = "C", mods = "Alt", action = "Copy" },
  { key = "V", mods = "Alt", action = "Paste" },
]
[general]
live_config_reload = true
