unbind -a -T root

bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

bind -n M-1 select-window -t 0
bind -n M-2 select-window -t 1
bind -n M-3 select-window -t 2
bind -n M-4 select-window -t 3
bind -n M-5 select-window -t 4
bind -n M-6 select-window -t 5
bind -n M-7 select-window -t 6
bind -n M-8 select-window -t 7
bind -n M-9 select-window -t 8

bind -n M-e split-window -h
bind -n M-r split-window -v

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-Enter new-window
bind -n M-Q kill-window

setw -g mode-keys vi

#set -g status-position top
set -g xterm-keys on
set -g default-terminal "tmux-256color"
set -g terminal-overrides "xterm-256color:RGB"

set -g status-style "bg=black,fg=black"
set -g status-left "#[bg=white,fg=black,bold] ^#I: #[bg=black,fg=white] "
set -g status-right "#[bg=white,fg=black] %Y/%m/%d %H:%M #[bg=white,fg=black]"
set -g window-status-format "#[bg=black,fg=white]#I=#W "
set -g window-status-current-format "#[bg=black,fg=white]#I=#W*"
set -g window-status-separator "#[fg=white]: "

set -g pane-border-style "fg=color243"
set -g pane-active-border-style "fg=white"

set -sg escape-time 0
